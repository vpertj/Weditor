name: Build and Release

permissions:
  contents: write

on:
  push:
    branches: [ main, master, release ]
    tags: [ 'v*.*.*' ]

# 同一分支的发布串行执行：否则两次快速推送会同时算出同一个"下一版本号"而撞车
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 统一算一次版本号，三个平台和 release 共用，避免各自算出不同结果。
  # - 推 tag：直接用 tag（发 minor/major 版本走这条路）
  # - 推分支：取现有最高正式版本 vX.Y.Z，补丁号 +1 —— 推送即发布
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          LATEST=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            # 只认纯 x.y.z 的正式 tag：-dev-<sha> 之类的历史预发布 tag 不参与计算，
            # 否则补丁号的基数会被它们带偏。
            # 末尾 `|| true` 必需：没有匹配时 grep 返回 1，在 bash -e 下会让整步失败
            LATEST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              VERSION="v1.0.0"
            else
              VERSION="v$(echo "${LATEST#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $VERSION（现有最高正式 tag: ${LATEST:-无}）"

  build:
    name: Build for ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev libjavascriptcoregtk-4.1-dev libsoup2.4-dev
          # Create symlinks for webkit2gtk-4.0 compatibility
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/javascriptcoregtk-4.0.pc

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Use resolved version
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
        shell: bash

      - name: Compute build metadata
        run: |
          # 数值化版本：macOS 的 CFBundleVersion 与 Windows 版本资源都要求 x.y.z，
          # 带 -dev-<sha> 后缀的预发布标签不能直接写进去
          NUMERIC=$(echo "$VERSION" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$NUMERIC" ]; then
            NUMERIC="0.0.0"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 注入到 Go 变量：App 靠 APP_VERSION 判断新旧，靠 APP_BUILD_TIME 判断
          # 开发通道的构建先后（dev 版本号之间无法比较大小）
          LDFLAGS="-X main.APP_VERSION=$VERSION -X main.APP_COMMIT=$COMMIT -X main.APP_BUILD_TIME=$BUILD_TIME"

          {
            echo "NUMERIC=$NUMERIC"
            echo "COMMIT=$COMMIT"
            echo "BUILD_TIME=$BUILD_TIME"
            echo "LDFLAGS=$LDFLAGS"
          } >> $GITHUB_ENV
        shell: bash

      - name: Inject version into package metadata
        run: |
          # macOS: build/darwin/Info.plist 是原样拷贝的（不含 wails 模板变量），
          # 必须直接改写，否则 Finder 里看到的版本号永远是 1.0.0
          perl -0pi -e "s|(<key>CFBundleShortVersionString</key>\s*<string>)[^<]*|\${1}${NUMERIC}|" build/darwin/Info.plist
          perl -0pi -e "s|(<key>CFBundleVersion</key>\s*<string>)[^<]*|\${1}${NUMERIC}|" build/darwin/Info.plist

          # Windows: build/windows/info.json 会展开 {{.Info.ProductVersion}}
          perl -0pi -e "s|(\"productVersion\":\s*\")[^\"]*|\${1}${NUMERIC}|" wails.json

          echo "=== build/darwin/Info.plist ==="
          grep -A1 -E "CFBundleShortVersionString|CFBundleVersion" build/darwin/Info.plist
          echo "=== wails.json ==="
          grep -E "productVersion" wails.json
        shell: bash

      - name: Verify build metadata
        run: |
          echo "VERSION=$VERSION"
          echo "NUMERIC=$NUMERIC"
          echo "LDFLAGS=$LDFLAGS"
          if [ -z "$LDFLAGS" ]; then
            echo "::error::LDFLAGS 为空，版本号不会被注入，自动更新将失效"
            exit 1
          fi
        shell: bash

      - name: Update version in package.json
        run: |
          cd frontend
          npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
        shell: bash

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Wails application (macOS Universal)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: wails build -platform darwin/universal -ldflags "$LDFLAGS"

      - name: Build Wails application (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: wails build -tags webkit2_41 -ldflags "$LDFLAGS"

      - name: Verify version injected into binary
        shell: bash
        run: |
          # 这道关卡是自动更新的生命线：版本号若没进产物，App 会永远认为"已是最新"，
          # 而且不会有任何报错。所以直接到产物里找注入的版本字符串。
          case "${{ matrix.os }}" in
            macos-latest)   BIN="build/bin/WEditor.app/Contents/MacOS/WEditor" ;;
            windows-latest) BIN="build/bin/WEditor.exe" ;;
            *)              BIN="build/bin/WEditor" ;;
          esac

          if [ ! -f "$BIN" ]; then
            echo "::error::找不到构建产物 $BIN"
            exit 1
          fi
          if ! grep -a -q -F "$VERSION" "$BIN"; then
            echo "::error::产物中未找到版本号 $VERSION，-ldflags 注入失败，自动更新将失效"
            exit 1
          fi
          echo "✓ 已确认版本 $VERSION 注入产物"

      - name: Create macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          APP_PATH="build/bin/WEditor.app"
          DMG_NAME="WEditor-${{ env.VERSION }}"
          STAGING="/tmp/weditor-dmg-staging"
          RW_DMG="/tmp/weditor-rw.dmg"
          OUTPUT_DMG="build/bin/${DMG_NAME}.dmg"

          echo "=== Creating DMG from: $APP_PATH ==="

          # 创建临时目录，放入 app 和 Applications 快捷方式
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # 创建可读写 DMG
          hdiutil create -size 200m -fs HFS+ -volname "${DMG_NAME}" -srcfolder "$STAGING" -format UDRW "$RW_DMG" -quiet

          # 挂载 DMG
          DEVICE=$(hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG" 2>&1 | grep Apple_HFS | awk '{print $1}')
          echo "Mounted at device: $DEVICE"
          sleep 2

          # 设置 Finder 窗口布局
          VOLUME_PATH="/Volumes/${DMG_NAME}"
          osascript <<EOF
          tell application "Finder"
            tell disk "${DMG_NAME}"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 200, 900, 520}
              set theViewOptions to the icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 72
              set position of item "WEditor.app" of container window to {160, 140}
              set position of item "Applications" of container window to {340, 140}
              close
              open
              update without registering applications
              delay 1
              close
            end tell
          end tell
          EOF
          echo "Finder layout applied"

          # 卸载 DMG
          hdiutil detach "/Volumes/${DMG_NAME}" -force 2>/dev/null || true
          sleep 1

          # 转换为压缩只读 DMG
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$OUTPUT_DMG" -quiet

          # 清理
          rm -f "$RW_DMG"
          rm -rf "$STAGING"

          echo "=== DMG created: $OUTPUT_DMG ==="
          ls -lh "$OUTPUT_DMG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/bin/*

  release:
    needs: [build, version]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug - List artifacts directory
        run: ls -laR artifacts/

      - name: Set release information
        id: release_info
        run: |
          # 版本号来自 version job；分支推送同样发正式版，所以 PRERELEASE 恒为 false。
          # tag 不存在时 action-gh-release 会按当前提交自动创建（用 GITHUB_TOKEN
          # 创建 tag 不会再次触发本工作流，不会形成循环）。
          TAG_NAME="${{ needs.version.outputs.version }}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Release ${TAG_NAME}" >> "$GITHUB_ENV"
          echo "PRERELEASE=false" >> "$GITHUB_ENV"
          echo "本次发布: Release ${TAG_NAME}"
        shell: bash

      - name: Rename build artifacts
        run: |
          # Windows
          mv artifacts/build-windows-latest/WEditor.exe artifacts/build-windows-latest/WEditor-windows.exe 2>/dev/null || true

          # macOS: 保留 DMG 并 zip app
          cd artifacts/build-macos-latest
          DMG_FILE=$(ls WEditor-*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "Found DMG: $DMG_FILE"
            mv "$DMG_FILE" "../$DMG_FILE"
          fi
          zip -r WEditor-macos.app.zip WEditor.app 2>/dev/null || true
          cd ../..

          # Linux
          mv artifacts/build-ubuntu-latest/WEditor artifacts/build-ubuntu-latest/WEditor-linux 2>/dev/null || true

          # 汇总所有要上传的文件到 artifacts/ 目录
          echo "=== Final artifacts ==="
          find artifacts -type f -not -path '*/\.[!.]*' | sort

      - name: Generate update manifest
        shell: bash
        run: |
          # 更新清单是 App 判断"有没有新版本"的唯一权威来源：
          # 资产名、大小、sha256 都由发布方声明，App 不需要猜文件名
          VERSION="$TAG_NAME" \
          CHANNEL="$([ "$PRERELEASE" = "true" ] && echo dev || echo stable)" \
          NOTES="$RELEASE_NAME" \
          REPO="${{ github.repository }}" \
          python3 - <<'PY'
          import datetime, hashlib, json, os

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          # 键名与 App 侧的 assetKeyCandidates() 对应
          candidates = {
              "darwin-universal": "artifacts/build-macos-latest/WEditor-macos.app.zip",
              "windows-amd64": "artifacts/build-windows-latest/WEditor-windows.exe",
              "linux-amd64": "artifacts/build-ubuntu-latest/WEditor-linux",
          }

          assets = {}
          for key, path in candidates.items():
              if not os.path.isfile(path):
                  print(f"警告：缺少 {path}，跳过 {key}")
                  continue
              name = os.path.basename(path)
              assets[key] = {
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{version}/{name}",
                  "size": os.path.getsize(path),
                  "sha256": sha256(path),
              }

          if not assets:
              raise SystemExit("没有任何可用产物，不生成更新清单")

          manifest = {
              "version": version,
              "channel": os.environ["CHANNEL"],
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": os.environ.get("NOTES", ""),
              "assets": assets,
          }
          with open("artifacts/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          files: |
            artifacts/build-windows-latest/WEditor-windows.exe
            artifacts/build-macos-latest/WEditor-macos.app.zip
            artifacts/WEditor-*.dmg
            artifacts/build-ubuntu-latest/WEditor-linux
            artifacts/latest.json
          generate_release_notes: false
          fail_on_unmatched_files: false
